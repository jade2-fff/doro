<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:#1a1a2e;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;font-family:Arial;overflow-x:hidden;user-select:none;-webkit-user-select:none}audio{display:none}.doro{position:relative;width:280px;height:280px;cursor:pointer;animation:float 3s ease-in-out infinite;-webkit-animation:float 3s ease-in-out infinite}@-webkit-keyframes float{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-15px)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}.body{position:absolute;width:260px;height:250px;background:radial-gradient(ellipse at 40% 30%,#fff 0%,#f0ece6 50%,#e8e3db 100%);border-radius:55% 45% 48% 52%/52% 48% 52% 48%;top:15px;left:10px;box-shadow:inset 0 -10px 30px rgba(0,0,0,.06),0 10px 40px rgba(0,0,0,.25)}.cheek{position:absolute;width:55px;height:35px;background:radial-gradient(ellipse,rgba(255,150,150,.6) 0%,rgba(255,150,150,0) 70%);border-radius:50%;top:140px}.cheek.left{left:30px}.cheek.right{right:30px}.eye{position:absolute;width:28px;height:32px;background:#222;border-radius:50%;top:100px;animation:blink 4s infinite;-webkit-animation:blink 4s infinite}.eye::after{content:'';position:absolute;width:10px;height:10px;background:#fff;border-radius:50%;top:6px;left:5px}.eye.left{left:85px}.eye.right{right:85px}@-webkit-keyframes blink{0%,45%,55%,100%{-webkit-transform:scaleY(1)}50%{-webkit-transform:scaleY(.1)}}@keyframes blink{0%,45%,55%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}.mouth{position:absolute;width:20px;height:10px;border-bottom:3px solid #999;border-radius:0 0 50% 50%;top:145px;left:50%;transform:translateX(-50%);-webkit-transform:translateX(-50%)}.hand{position:absolute;width:40px;height:40px;background:radial-gradient(circle at 60% 40%,#fff 0%,#f0ece6 80%);border-radius:50%;top:140px;box-shadow:0 3px 10px rgba(0,0,0,.1)}.hand.left{left:-10px;animation:waveL 2s ease-in-out infinite;-webkit-animation:waveL 2s ease-in-out infinite}.hand.right{right:-10px;animation:waveR 2s ease-in-out infinite .3s;-webkit-animation:waveR 2s ease-in-out infinite .3s}@-webkit-keyframes waveL{0%,100%{-webkit-transform:rotate(0) translateY(0)}50%{-webkit-transform:rotate(-15deg) translateY(-8px)}}@keyframes waveL{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-15deg) translateY(-8px)}}@-webkit-keyframes waveR{0%,100%{-webkit-transform:rotate(0) translateY(0)}50%{-webkit-transform:rotate(15deg) translateY(-8px)}}@keyframes waveR{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(15deg) translateY(-8px)}}.bubble{position:absolute;top:-80px;left:50%;-webkit-transform:translateX(-50%) scale(0);transform:translateX(-50%) scale(0);background:#fff;color:#333;padding:14px 24px;border-radius:50px;font-size:22px;font-weight:bold;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:10;transition:transform .3s cubic-bezier(.34,1.56,.64,1);-webkit-transition:-webkit-transform .3s cubic-bezier(.34,1.56,.64,1)}.bubble::after{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);-webkit-transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:14px solid #fff}.bubble.show{-webkit-transform:translateX(-50%) scale(1);transform:translateX(-50%) scale(1)}.hint{color:rgba(255,255,255,.4);font-size:16px;letter-spacing:3px}.shake{animation:shake .5s ease-in-out;-webkit-animation:shake .5s ease-in-out}@-webkit-keyframes shake{0%,100%{-webkit-transform:translateX(0)}20%{-webkit-transform:translateX(-15px) rotate(-5deg)}40%{-webkit-transform:translateX(15px) rotate(5deg)}60%{-webkit-transform:translateX(-10px) rotate(-3deg)}80%{-webkit-transform:translateX(10px) rotate(3deg)}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-15px) rotate(-5deg)}40%{transform:translateX(15px) rotate(5deg)}60%{transform:translateX(-10px) rotate(-3deg)}80%{transform:translateX(10px) rotate(3deg)}}.particle{position:absolute;pointer-events:none;font-size:24px;animation:fly .8s ease-out forwards;-webkit-animation:fly .8s ease-out forwards}@-webkit-keyframes fly{0%{-webkit-transform:translateY(0) scale(1);opacity:1}100%{-webkit-transform:translateY(-150px) scale(0);opacity:0}}@keyframes fly{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-150px) scale(0);opacity:0}}.qr-section{display:flex;flex-direction:column;align-items:center;margin-top:25px;opacity:0;-webkit-transform:translateY(20px);transform:translateY(20px);transition:all .5s ease;-webkit-transition:all .5s ease}.qr-section.show{opacity:1;-webkit-transform:translateY(0);transform:translateY(0)}.qr-img{width:180px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.4)}.qr-label{color:rgba(255,255,255,.5);font-size:13px;margin-bottom:10px;letter-spacing:2px}</style>
